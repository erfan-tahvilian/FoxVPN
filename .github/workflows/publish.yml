name: Stage verified desktop packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run with matching desktop source
        required: true
        type: string
      mac_run_id:
        description: Successful macOS build run with matching desktop source
        required: true
        type: string
      linux_run_id:
        description: Successful Linux build run with matching desktop source
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Read release version
        run: node .github/scripts/release-tools.cjs metadata >> "$GITHUB_ENV"
      - name: Verify source and build identity
        env:
          GH_TOKEN: ${{ github.token }}
          FOX_RUN_ID: ${{ inputs.run_id }}
          FOX_MAC_RUN_ID: ${{ inputs.mac_run_id }}
          FOX_LINUX_RUN_ID: ${{ inputs.linux_run_id }}
        run: |
          [[ "$FOX_RUN_ID" =~ ^[0-9]+$ ]]
          test -n "$FOX_VERSION"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FOX_RUN_ID" > /tmp/fox-run.json
          test "$(jq -r '.conclusion' /tmp/fox-run.json)" = 'success'
          fox_windows_sha="$(jq -r '.head_sha' /tmp/fox-run.json)"
          git cat-file -e "$fox_windows_sha^{commit}"
          git diff --exit-code "$fox_windows_sha" HEAD -- src assets licenses LICENSE COPYRIGHT release-notes.json package.json package-lock.json scripts ':(exclude)scripts/*android*' .github/workflows/windows.yml .github/workflows/macos.yml
          [[ "$FOX_MAC_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FOX_MAC_RUN_ID" > /tmp/fox-mac-run.json
          test "$(jq -r '.conclusion' /tmp/fox-mac-run.json)" = 'success'
          fox_mac_sha="$(jq -r '.head_sha' /tmp/fox-mac-run.json)"
          git cat-file -e "$fox_mac_sha^{commit}"
          git diff --exit-code "$fox_mac_sha" HEAD -- src assets licenses LICENSE COPYRIGHT release-notes.json package.json package-lock.json scripts ':(exclude)scripts/*android*' .github/workflows/windows.yml .github/workflows/macos.yml
          [[ "$FOX_LINUX_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FOX_LINUX_RUN_ID" > /tmp/fox-linux-run.json
          test "$(jq -r '.conclusion' /tmp/fox-linux-run.json)" = 'success'
          test "$(jq -r '.path' /tmp/fox-linux-run.json)" = '.github/workflows/linux.yml'
          fox_linux_sha="$(jq -r '.head_sha' /tmp/fox-linux-run.json)"
          git cat-file -e "$fox_linux_sha^{commit}"
          git diff --exit-code "$fox_linux_sha" HEAD -- src assets licenses LICENSE COPYRIGHT release-notes.json package.json package-lock.json scripts ':(exclude)scripts/*android*' .github/workflows/linux.yml
      - uses: actions/download-artifact@v4
        with:
          pattern: FoxVPN-Windows-*
          merge-multiple: true
          path: verified-build
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: FoxVPN-macOS-*
          merge-multiple: true
          path: verified-build
          run-id: ${{ inputs.mac_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: FoxVPN-Linux-*
          merge-multiple: true
          path: verified-build
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare versioned draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-tools.cjs ensure-draft
      - name: Verify native GitHub source matches the complete exported commit
        run: python .github/scripts/verify-source.py
      - name: Inspect historical maintenance source before its duplicate is retired
        if: env.FOX_VERSION == '1.0.2'
        run: python .github/scripts/verify-source.py --commit 3dcbb26 --url https://github.com/erfan-tahvilian/FoxVPN/releases/download/v1.0.1/FoxVPN-1.0.1-source.tar.gz --sha256 8d234df535f38a4db9379cbd0a6006738f7b294351637be09ea544d56a7b6f85 --report historical-v101-source-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: Source-archive-verification
          path: test-results/*verification.json
      - name: Prepare release assets
        run: |
          mkdir release-assets
          # Native GitHub source archives use the exact release target commit.
          # Retain the separate sing-box GPL source archive below.
          for arch in x64 x86 arm64; do
            for ext in exe zip; do
              test -s "verified-build/dist/FoxVPN-$FOX_VERSION-Windows-$arch.$ext"
              cp "verified-build/dist/FoxVPN-$FOX_VERSION-Windows-$arch.$ext" release-assets/
            done
          done
          for arch in x64 arm64; do
            for ext in dmg zip; do
              test -s "verified-build/dist/FoxVPN-$FOX_VERSION-macOS-$arch.$ext"
              cp "verified-build/dist/FoxVPN-$FOX_VERSION-macOS-$arch.$ext" release-assets/
            done
          done
          for arch in x64 arm64; do
            for ext in AppImage deb rpm; do
              test -s "verified-build/dist/FoxVPN-$FOX_VERSION-Linux-$arch.$ext"
              cp "verified-build/dist/FoxVPN-$FOX_VERSION-Linux-$arch.$ext" release-assets/
            done
          done
          curl --fail --location --retry 3 'https://codeload.github.com/SagerNet/sing-box/tar.gz/refs/tags/v1.12.0' -o release-assets/sing-box-1.12.0-source.tar.gz
          echo '1093254161d2dac2175a589eb0b43415b89b3e0c10bb2a09ac230f320d974c82  release-assets/sing-box-1.12.0-source.tar.gz' | sha256sum --check
      - name: Stage verified desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$FOX_TAG" release-assets/* --clobber
