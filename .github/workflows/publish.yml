name: Publish verified desktop builds
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run with matching desktop source
        required: true
        type: string
      mac_run_id:
        description: Successful macOS build run with matching desktop source
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify source and build identity
        env:
          GH_TOKEN: ${{ github.token }}
          FOX_RUN_ID: ${{ inputs.run_id }}
          FOX_MAC_RUN_ID: ${{ inputs.mac_run_id }}
        run: |
          [[ "$FOX_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(node -p 'require("./package.json").version')" = '1.0.0'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FOX_RUN_ID" > /tmp/fox-run.json
          test "$(jq -r '.conclusion' /tmp/fox-run.json)" = 'success'
          fox_windows_sha="$(jq -r '.head_sha' /tmp/fox-run.json)"
          git cat-file -e "$fox_windows_sha^{commit}"
          git diff --exit-code "$fox_windows_sha" HEAD -- src assets licenses LICENSE package.json package-lock.json scripts ':(exclude)scripts/*android*' .github/workflows/windows.yml .github/workflows/macos.yml
          [[ "$FOX_MAC_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FOX_MAC_RUN_ID" > /tmp/fox-mac-run.json
          test "$(jq -r '.conclusion' /tmp/fox-mac-run.json)" = 'success'
          fox_mac_sha="$(jq -r '.head_sha' /tmp/fox-mac-run.json)"
          git cat-file -e "$fox_mac_sha^{commit}"
          git diff --exit-code "$fox_mac_sha" HEAD -- src assets licenses LICENSE package.json package-lock.json scripts ':(exclude)scripts/*android*' .github/workflows/windows.yml .github/workflows/macos.yml
      - uses: actions/download-artifact@v4
        with:
          pattern: FoxVPN-Windows-*
          merge-multiple: true
          path: verified-build
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: FoxVPN-macOS-*
          merge-multiple: true
          path: verified-build
          run-id: ${{ inputs.mac_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare release assets
        run: |
          mkdir release-assets
          for arch in x64 x86 arm64; do
            for ext in exe zip; do
              test -s "verified-build/dist/FoxVPN-1.0.0-Windows-$arch.$ext"
              cp "verified-build/dist/FoxVPN-1.0.0-Windows-$arch.$ext" release-assets/
            done
          done
          for arch in x64 arm64; do
            for ext in dmg zip; do
              test -s "verified-build/dist/FoxVPN-1.0.0-macOS-$arch.$ext"
              cp "verified-build/dist/FoxVPN-1.0.0-macOS-$arch.$ext" release-assets/
            done
          done
          curl --fail --location --retry 3 'https://codeload.github.com/SagerNet/sing-box/tar.gz/refs/tags/v1.12.0' -o release-assets/sing-box-1.12.0-source.tar.gz
      - name: Publish fixed v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0 release-assets/* --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" > /tmp/fox-release.json
          jq -e '[.assets[] | select(.name != "SHA256SUMS.txt") | .digest | test("^sha256:[a-f0-9]{64}$")] | all' /tmp/fox-release.json
          jq -r '.assets[] | select(.name != "SHA256SUMS.txt") | "\(.digest | sub("^sha256:";""))  \(.name)"' /tmp/fox-release.json | sort -k2 > SHA256SUMS.txt
          gh release upload v1.0.0 SHA256SUMS.txt --clobber
          gh release edit v1.0.0 --draft=false --title 'Fox VPN v1.0.0 — Windows, macOS & Android' --notes-file RELEASE_NOTES.md
