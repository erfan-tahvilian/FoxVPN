name: Android build
on:
  push:
    branches: [main]
    paths: ['package*.json', 'release-notes.json', 'scripts/check-version.cjs', 'android/**', 'src/ui/**', 'assets/**', 'licenses/**', 'LICENSE', 'COPYRIGHT', 'scripts/*android*', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - name: Verify version metadata
        run: node scripts/check-version.cjs
      - name: Verify lossless APK compression
        run: python -m unittest discover -s tests -p apk_compression_test.py
      - name: Verify Android core
        working-directory: android/core
        run: |
          gofmt -w mobile engine cmd tools.go
          go mod tidy
          go test -race -timeout 90s -v ./mobile
          go vet ./mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-core-lockfile
          path: |
            android/core/go.*
            android/core/mobile/*.go
            android/core/engine/*.go
            android/core/tools.go
  android:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android toolchain
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: android/app/libs/
          key: android-native-go1.26.9-ndk28-bind0.1.7-${{ hashFiles('android/core/mobile/**/*.go', 'android/core/engine/**/*.go', 'android/core/tools.go', 'android/core/go.mod', 'android/core/go.sum') }}
      - name: Build native Android library
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: android/core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: |
          go mod tidy
          go install github.com/sagernet/gomobile/cmd/gomobile
          go install github.com/sagernet/gomobile/cmd/gobind
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -v -target android -androidapi 26 -javapkg=com.foxvpn.nativebridge -libname=foxvpn -trimpath -tags with_gvisor,with_clash_api,with_conntrack -ldflags '-X github.com/sagernet/sing-box/constant.Version=1.12.0 -s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384' -o ../app/libs/foxvpn.aar ./mobile github.com/sagernet/sing-box/experimental/libbox
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: android/app/libs/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Prepare interface
        run: node scripts/prepare-android.cjs
      - name: Bundle dependency notices
        run: node scripts/android-notices.cjs
      - name: Compile and inspect Android packages
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:assembleDebug :app:lintRelease --stacktrace
      - name: Verify all native architectures and 16 KB alignment
        # Recompression preserves every entry, including native libraries and DEX.
        # Validation below checks all resulting architectures again.
        run: |
          python scripts/compact-android.py
          python scripts/validate-android.py > android/app/build/reports/package-validation.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android device integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/test-android-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-results
          path: test-results/android/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-diagnostics
          path: |
            android/app/libs/*
            android/app/build/reports/
            test-results/android/
            android/core/go.*
      - uses: actions/upload-artifact@v4
        with:
          name: Android-unsigned-build
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-unsigned-arm64
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
      - name: Collect local signing tools
        run: |
          mkdir signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/zipalign-linux
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-tools
          path: signing-tools/
