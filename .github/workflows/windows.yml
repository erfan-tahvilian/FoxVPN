name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-electron.cjs
      - run: npm run engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: npm run check
      - name: Validate Windows engine configuration
        run: node scripts/validate-engine.cjs
      - name: Renderer smoke test
        run: npm run smoke
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged source and resources
        run: node scripts/validate-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: FoxVPN-Windows-v1.0.0
          path: |
            dist/*.exe
            dist/*.zip
            test-results/*.png
