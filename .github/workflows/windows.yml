name: Windows build
on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'licenses/**', 'package*.json', 'scripts/**', '!scripts/*android*', '.github/workflows/windows.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            label: x64
            runner: windows-latest
          - arch: ia32
            label: x86
            runner: windows-latest
          - arch: arm64
            label: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      FOX_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-electron.cjs
      - run: npm run engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: npm run check
      - name: Validate Windows engine configuration
        run: node scripts/validate-engine.cjs
      - name: Renderer smoke test
        run: npm run smoke
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged source and resources
        run: node scripts/validate-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: FoxVPN-Windows-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.zip
            test-results/*.png
