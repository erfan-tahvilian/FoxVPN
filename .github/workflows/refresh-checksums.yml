name: Refresh release checksums
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Verify asset digests and refresh checksum filenames
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/v1.0.0" > /tmp/release.json
          jq -e '[.assets[] | select(.name != "SHA256SUMS.txt") | .digest | test("^sha256:[a-f0-9]{64}$")] | all' /tmp/release.json
          jq -r '.assets[] | select(.name != "SHA256SUMS.txt") | "\(.digest | sub("^sha256:";""))  \(.name)"' /tmp/release.json | sort -k2 > SHA256SUMS.txt
          gh release upload v1.0.0 SHA256SUMS.txt --clobber
