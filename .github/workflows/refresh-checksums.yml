name: Validate release source policy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate assets and source policy
        run: |
          node --test tests/release-policy.test.cjs
          python -m unittest discover -s tests -p source_archive_test.py
