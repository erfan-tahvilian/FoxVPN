name: Refresh release source and checksums
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        run: node .github/scripts/release-tools.cjs metadata >> "$GITHUB_ENV"
      - name: Prepare versioned draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-tools.cjs ensure-draft
      - name: Refresh unpublished source only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=tar.gz --prefix=FoxVPN/ HEAD > "FoxVPN-$FOX_VERSION-source.tar.gz"
          gh release upload "$FOX_TAG" "FoxVPN-$FOX_VERSION-source.tar.gz" --clobber
