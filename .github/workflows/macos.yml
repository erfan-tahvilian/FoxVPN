name: macOS build
on:
  push:
    branches: [main]
    paths: ['desktop/h3/**', 'src/**', 'assets/**', 'licenses/**', 'LICENSE', 'COPYRIGHT', 'package*.json', 'release-notes.json', 'scripts/**', '!scripts/*android*', '.github/workflows/macos.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      FOX_TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run engine:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: desktop/h3/go.sum
      - name: Build native HTTP3 transport
        working-directory: desktop/h3
        run: |
          go test -race ./...
          case "$FOX_TARGET_ARCH" in x64) export GOARCH=amd64;; arm64) export GOARCH=arm64;; esac
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../../engine/darwin/$FOX_TARGET_ARCH/fox-h3 .
      - run: npm test
      - run: npm run check
      - run: node scripts/validate-engine.cjs
      - run: node scripts/validate-mac-tun.cjs
      - run: npm run smoke
      - run: npm run dist:mac
      - run: node scripts/validate-mac-package.cjs
      - name: Verify compressed disk image and archive payloads
        run: node scripts/verify-distribution.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: FoxVPN-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            test-results/*.png
            test-results/package-roundtrip-*.json
