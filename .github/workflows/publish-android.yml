name: Publish locally signed Android packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android build run
        required: true
        type: string
      patch_blob:
        description: Git blob containing public APK signature deltas
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FOX_RUN_ID: ${{ inputs.run_id }}
      FOX_PATCH_BLOB: ${{ inputs.patch_blob }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify app source and retrieve public signature data
        run: |
          [[ "$FOX_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$FOX_PATCH_BLOB" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FOX_RUN_ID" > /tmp/source-run.json
          test "$(jq -r '.conclusion' /tmp/source-run.json)" = success
          test "$(jq -r '.path' /tmp/source-run.json)" = .github/workflows/android.yml
          source_sha="$(jq -r '.head_sha' /tmp/source-run.json)"
          git diff --exit-code "$source_sha" HEAD -- android src/ui assets licenses LICENSE COPYRIGHT scripts/prepare-android.cjs scripts/android-notices.cjs .github/workflows/android.yml ":(exclude)android/core/apple/**"
          echo "FOX_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$FOX_PATCH_BLOB" > /tmp/signature-blob.json
          test "$(jq -r '.encoding' /tmp/signature-blob.json)" = base64
          jq -r '.content' /tmp/signature-blob.json | base64 --decode > /tmp/signatures.zip
      - uses: actions/download-artifact@v4
        with:
          name: Android-unsigned-build
          path: unsigned
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Reproduce and verify signed release packages
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
          python .github/scripts/apk_delta.py apply unsigned /tmp/signatures.zip signed "$FOX_RUN_ID" "$FOX_SOURCE_SHA"
          expected="$(tr -d '\r\n' < android/signing-certificate.sha256)"
          for apk in signed/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > /tmp/signature-check.txt
            grep -F "Signer #1 certificate SHA-256 digest: $expected" /tmp/signature-check.txt
            grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature-check.txt
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          done
      - name: Publish APKs and update all release checksums
        run: |
          gh release upload v1.0.0 signed/*.apk --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" > /tmp/release.json
          jq -e '[.assets[] | select(.name != "SHA256SUMS.txt") | .digest | test("^sha256:[a-f0-9]{64}$")] | all' /tmp/release.json
          jq -r '.assets[] | select(.name != "SHA256SUMS.txt") | "\(.digest | sub("^sha256:";""))  \(.name)"' /tmp/release.json | sort -k2 > SHA256SUMS.txt
          gh release upload v1.0.0 SHA256SUMS.txt --clobber
