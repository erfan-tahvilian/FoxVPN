name: Prepare incremental APKs for local signing
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful target Android build
        required: true
        type: string
      base_run_id:
        description: Successful Android build already cached locally
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  delta:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FOX_TARGET_RUN: ${{ inputs.run_id }}
      FOX_BASE_RUN: ${{ inputs.base_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify build identities and application source
        run: |
          [[ "$FOX_TARGET_RUN" =~ ^[0-9]+$ ]]
          [[ "$FOX_BASE_RUN" =~ ^[0-9]+$ ]]
          for run in "$FOX_TARGET_RUN" "$FOX_BASE_RUN"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "/tmp/run-$run.json"
            test "$(jq -r '.conclusion' "/tmp/run-$run.json")" = success
            test "$(jq -r '.path' "/tmp/run-$run.json")" = .github/workflows/android.yml
          done
          target_sha="$(jq -r '.head_sha' "/tmp/run-$FOX_TARGET_RUN.json")"
          base_sha="$(jq -r '.head_sha' "/tmp/run-$FOX_BASE_RUN.json")"
          git diff --exit-code "$target_sha" HEAD -- android src/ui assets licenses LICENSE COPYRIGHT scripts/prepare-android.cjs scripts/android-notices.cjs .github/workflows/android.yml ":(exclude)android/core/apple/**"
          echo "FOX_TARGET_SHA=$target_sha" >> "$GITHUB_ENV"
          echo "FOX_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          jq -n --arg target_run "$FOX_TARGET_RUN" --arg target_sha "$target_sha" --arg base_run "$FOX_BASE_RUN" --arg base_sha "$base_sha" '{target_run:$target_run,target_sha:$target_sha,base_run:$base_run,base_sha:$base_sha}' > build-identity.json
      - uses: actions/download-artifact@v4
        with:
          name: Android-unsigned-build
          path: base
          run-id: ${{ inputs.base_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Android-unsigned-build
          path: target
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare small verified APK deltas
        run: |
          mkdir renamed
          for arch in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            cp "target/app-$arch-release-unsigned.apk" "renamed/FoxVPN-1.0.0-Android-$arch.apk"
          done
          python .github/scripts/apk_delta.py create base renamed unsigned-delta.zip "$FOX_BASE_RUN" "$FOX_BASE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: Android-unsigned-delta
          path: |
            unsigned-delta.zip
            build-identity.json
