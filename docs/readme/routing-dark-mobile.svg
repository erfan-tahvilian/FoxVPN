<svg xmlns="http://www.w3.org/2000/svg" width="720" height="622" viewBox="0 0 720 622" role="img" aria-labelledby="title desc"><title id="title">Two split-tunneling modes</title><desc id="desc">Only selected: selected apps use the VPN, other apps connect directly. Exclude selected: selected apps connect directly, other apps use the VPN.</desc><rect x="1" y="1" width="706" height="300" rx="22" fill="#151a22" stroke="#2b3442"/><text x="31" y="40" fill="#ff8a42" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">01 / ONLY SELECTED</text><text x="31" y="85" fill="#f5f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" letter-spacing="-.7">Choose which apps use the VPN.</text><rect x="31" y="138" width="242" height="49" rx="10" fill="#0d1117" stroke="#2b3442"/><text x="50" y="173" fill="#f5f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Selected apps</text><path d="M289 163h140m-8-6 8 6-8 6" fill="none" stroke="#ff8a42" stroke-width="2" /><rect x="448" y="138" width="227" height="49" rx="10" fill="#241c18" stroke="#ff8a42"/><text x="561" y="173" fill="#ff8a42" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="600">Through VPN</text><rect x="31" y="216" width="242" height="49" rx="10" fill="#0d1117" stroke="#2b3442"/><text x="50" y="251" fill="#f5f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Other apps</text><path d="M289 241h140m-8-6 8 6-8 6" fill="none" stroke="#a8b2c2" stroke-width="2" stroke-dasharray="5 5"/><rect x="448" y="216" width="227" height="49" rx="10" fill="#0d1117" stroke="#2b3442"/><text x="561" y="251" fill="#a8b2c2" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="600">Direct</text><rect x="1" y="320" width="706" height="300" rx="22" fill="#151a22" stroke="#2b3442"/><text x="31" y="359" fill="#ff8a42" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">02 / EXCLUDE SELECTED</text><text x="31" y="404" fill="#f5f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" letter-spacing="-.7">Keep selected apps direct.</text><rect x="31" y="457" width="242" height="49" rx="10" fill="#0d1117" stroke="#2b3442"/><text x="50" y="492" fill="#f5f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Selected apps</text><path d="M289 482h140m-8-6 8 6-8 6" fill="none" stroke="#a8b2c2" stroke-width="2" stroke-dasharray="5 5"/><rect x="448" y="457" width="227" height="49" rx="10" fill="#0d1117" stroke="#2b3442"/><text x="561" y="492" fill="#a8b2c2" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="600">Direct</text><rect x="31" y="535" width="242" height="49" rx="10" fill="#0d1117" stroke="#2b3442"/><text x="50" y="570" fill="#f5f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Other apps</text><path d="M289 560h140m-8-6 8 6-8 6" fill="none" stroke="#ff8a42" stroke-width="2" /><rect x="448" y="535" width="227" height="49" rx="10" fill="#241c18" stroke="#ff8a42"/><text x="561" y="570" fill="#ff8a42" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="600">Through VPN</text></svg>