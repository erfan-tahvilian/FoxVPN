<svg xmlns="http://www.w3.org/2000/svg" width="720" height="622" viewBox="0 0 720 622" role="img" aria-labelledby="title desc"><title id="title">Two split-tunneling modes</title><desc id="desc">Only selected: selected apps use the VPN, other apps connect directly. Exclude selected: selected apps connect directly, other apps use the VPN.</desc><rect x="1" y="1" width="706" height="300" rx="22" fill="#ffffff" stroke="#d5dce5"/><text x="31" y="40" fill="#b94b0a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">01 / ONLY SELECTED</text><text x="31" y="85" fill="#171e29" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" letter-spacing="-.7">Choose which apps use the VPN.</text><rect x="31" y="138" width="242" height="49" rx="10" fill="#f6f8fa" stroke="#d5dce5"/><text x="50" y="173" fill="#171e29" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Selected apps</text><path d="M289 163h140m-8-6 8 6-8 6" fill="none" stroke="#b94b0a" stroke-width="2" /><rect x="448" y="138" width="227" height="49" rx="10" fill="#fff0e5" stroke="#b94b0a"/><text x="561" y="173" fill="#b94b0a" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="600">Through VPN</text><rect x="31" y="216" width="242" height="49" rx="10" fill="#f6f8fa" stroke="#d5dce5"/><text x="50" y="251" fill="#171e29" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Other apps</text><path d="M289 241h140m-8-6 8 6-8 6" fill="none" stroke="#536176" stroke-width="2" stroke-dasharray="5 5"/><rect x="448" y="216" width="227" height="49" rx="10" fill="#f6f8fa" stroke="#d5dce5"/><text x="561" y="251" fill="#536176" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="600">Direct</text><rect x="1" y="320" width="706" height="300" rx="22" fill="#ffffff" stroke="#d5dce5"/><text x="31" y="359" fill="#b94b0a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">02 / EXCLUDE SELECTED</text><text x="31" y="404" fill="#171e29" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" letter-spacing="-.7">Keep selected apps direct.</text><rect x="31" y="457" width="242" height="49" rx="10" fill="#f6f8fa" stroke="#d5dce5"/><text x="50" y="492" fill="#171e29" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Selected apps</text><path d="M289 482h140m-8-6 8 6-8 6" fill="none" stroke="#536176" stroke-width="2" stroke-dasharray="5 5"/><rect x="448" y="457" width="227" height="49" rx="10" fill="#f6f8fa" stroke="#d5dce5"/><text x="561" y="492" fill="#536176" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="600">Direct</text><rect x="31" y="535" width="242" height="49" rx="10" fill="#f6f8fa" stroke="#d5dce5"/><text x="50" y="570" fill="#171e29" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Other apps</text><path d="M289 560h140m-8-6 8 6-8 6" fill="none" stroke="#b94b0a" stroke-width="2" /><rect x="448" y="535" width="227" height="49" rx="10" fill="#fff0e5" stroke="#b94b0a"/><text x="561" y="570" fill="#b94b0a" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="600">Through VPN</text></svg>