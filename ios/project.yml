name: FoxVPN
options:
  bundleIdPrefix: com.foxvpn
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    FOX_APP_GROUP: group.com.foxvpn.ios
    FOX_SHARED_KEYCHAIN: com.foxvpn.ios.shared
    FOX_CONTAINER_BUNDLE: com.foxvpn.ios
    GENERATE_INFOPLIST_FILE: 'NO'
targets:
  FoxVPN:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Generated/Web
        type: folder
        buildPhase: resources
      - path: Generated/cacert.pem
        buildPhase: resources
      - path: Generated/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foxvpn.ios
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(FOX_PROFILE_APP)
    dependencies:
      - framework: Frameworks/FoxCore.xcframework
        embed: false
      - sdk: libresolv.tbd
      - target: FoxVPNTunnel
        embed: true
      - target: FoxVPNWidgets
        embed: true
  FoxVPNTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - path: Shared
        excludes: [ConnectionIntent.swift]
      - path: Generated/cacert.pem
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foxvpn.ios.tunnel
        INFOPLIST_FILE: Config/Tunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Tunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
        PROVISIONING_PROFILE_SPECIFIER: $(FOX_PROFILE_TUNNEL)
    dependencies:
      - framework: Frameworks/FoxCore.xcframework
        embed: false
      - sdk: libresolv.tbd
  FoxVPNWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - path: Shared/SharedStore.swift
      - path: Shared/SessionSnapshot.swift
      - path: Shared/VPNActivity.swift
      - path: Shared/ConnectionIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foxvpn.ios.widgets
        INFOPLIST_FILE: Config/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
        PROVISIONING_PROFILE_SPECIFIER: $(FOX_PROFILE_WIDGETS)
  FoxVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foxvpn.ios.tests
        GENERATE_INFOPLIST_FILE: 'YES'
    dependencies:
      - target: FoxVPN
  FoxVPNUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foxvpn.ios.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
    dependencies:
      - target: FoxVPN
schemes:
  FoxVPN:
    build:
      targets:
        FoxVPN: all
    test:
      targets:
        - FoxVPNTests
        - FoxVPNUITests
    archive:
      config: Release
